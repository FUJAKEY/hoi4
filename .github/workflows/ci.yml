name: CI
on: [push, pull_request]

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
    - name: Configure
      run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
    - name: Build
      run: cmake --build build -j
    - name: Test
      run: ctest --test-dir build

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26
    - name: Configure
      run: cmake -B build-android -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a
    - name: Build
      run: cmake --build build-android -j
